name: Deploy Global API (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy Worker
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
          secrets: |
            GITHUB_GIST_ID
            GITHUB_TOKEN
        env:
          GITHUB_GIST_ID: ${{ secrets.BF_GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.BF_GH_TOKEN }}
      - name: Save API URL for game builds
        run: |
          URL="${{ steps.wrangler.outputs.deployment-url }}"
          if [ -z "$URL" ]; then URL="https://block-forge-api.workers.dev"; fi
          echo "Worker URL: $URL"
          gh variable set BF_API_URL --body "$URL"
        env:
          GH_TOKEN: ${{ secrets.BF_GH_TOKEN }}
